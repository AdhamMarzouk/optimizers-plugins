<?xml version="1.0" encoding="UTF-8"?>
<!--
  Optimizers signature background pattern — single repeatable tile cell.

  Source: traced from the OP icon geometry (assets/svg/icon-black.svg), the
  only mark geometry that exists in the kit — no separate outline-style
  pattern artwork was included in the original brand guidelines [GAP]. The
  filled letterform paths are rendered here as stroke-only outlines
  (fill: none) to satisfy the PDF's spec [FACT p.20]: "We use the logo icon
  'OP' with outline style in green color with opacity to match the
  background color."

  Usage: tile via CSS `background-image: url(...); background-repeat: repeat;`
  rather than an internal <pattern> element, so this file works as a plain
  tile in any tool (CSS, design software, etc.), not just inline SVG.

  Blend mode is applied by the CONSUMER, not baked into this file:
    - Overlay mode on Black Forest / dark backgrounds   [FACT p.20]
    - Multiply mode on Pastel Green backgrounds          [FACT p.20]
  See design-system/components.css for the op pattern overlay and op pattern
  multiply utility classes (BEM modifier syntax; hyphens omitted here to keep
  this comment valid XML).

  Opacity is exposed as the op pattern opacity custom property in
  design-system/tokens.css rather than a fixed alpha baked in here, since the
  PDF only specifies "opacity to match the background color" with no number
  [DEFAULT].

  Tile size, icon inset, and stroke weight are [DEFAULT] authoring choices —
  the source guidelines give no measurements for this treatment.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <g transform="translate(67.48,97.46) scale(0.1125)"
     fill="none" stroke="#6ae499" stroke-width="2" vector-effect="non-scaling-stroke"
